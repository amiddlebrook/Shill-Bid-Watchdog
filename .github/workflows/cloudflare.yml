name: Verify and deploy (Cloudflare Free)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Automated tests
        run: npm test
      - name: Validate JavaScript
        run: |
          node --check src/worker.mjs
          node --check src/engine.mjs
          node --check public/app.js
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explain missing credentials
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo 'Cloudflare deployment is not configured. Add GitHub Actions secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN.'
          exit 1
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply shillbid-watchdog-db --remote
      - name: Deploy Cloudflare Worker + UI
        run: npx wrangler deploy
