name: Verify and deploy (Cloudflare Free)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Automated tests
        run: npm test
      - name: Validate JavaScript
        run: |
          node --check src/worker.mjs
          node --check src/engine.mjs
          node --check public/app.js
  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WATCHDOG_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explain missing credentials
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo 'Cloudflare deployment is not configured. Add GitHub Actions secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN.'
          exit 1
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply shillbid-watchdog-db --remote
      - name: Deploy Cloudflare Worker + UI
        run: npx wrangler deploy | tee deploy-output.log
      - name: Set admin token from GitHub secret (if provided)
        if: env.WATCHDOG_ADMIN_TOKEN != ''
        run: printf '%s' "$WATCHDOG_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
      - name: Verify deployed Worker health
        run: |
          set -euo pipefail
          DEPLOY_URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+[.]workers[.]dev' deploy-output.log | tail -1)"
          test -n "$DEPLOY_URL"
          echo "Cloudflare endpoint: $DEPLOY_URL"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "$DEPLOY_URL/api/health" | node -e "
            let json = ''; process.stdin.on('data', c => json += c);
            process.stdin.on('end', () => {
              const data = JSON.parse(json);
              if (!data.success || data.data?.status !== 'healthy' || !data.data?.storage) process.exit(1);
              console.log('Cloudflare Worker is responding and has the D1 binding. Auth configured:', data.data.authConfigured);
            });
          "
