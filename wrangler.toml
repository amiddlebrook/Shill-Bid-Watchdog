name = "shillbid-watchdog"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets
[assets]
directory = "./public"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "shillbid-watchdog-db"
database_id = "67de689d-41c6-4762-8e8f-894457b9a9c1"

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "9c8633593ef140e6996301d2a8d287f0"

# Browser Rendering for AI Agent navigation
[browser]
binding = "BROWSER"

# Workers AI for ML models
[ai]
binding = "AI"

# Vectorize for pattern embeddings
[[vectorize]]
binding = "VECTORS"
index_name = "bid-patterns"

# Durable Objects for Agent Coordination
[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "CoordinatorAgent"

[[migrations]]
tag = "v1"
new_classes = ["CoordinatorAgent"]

# Environment variables
[vars]
ENVIRONMENT = "production"
