<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b111b">
  <meta name="description" content="A transparent auction bid-pattern investigation dashboard. Track bids, review risk signals, and keep the evidence.">
  <title>ShillBid Watchdog — Auction intelligence</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">◈</div><div><strong>SHILLBID</strong><span>WATCHDOG / V2</span></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav aria-label="Primary navigation">
        <button class="nav active" data-view="overview"><span class="nav-icon">◫</span> Overview</button>
        <button class="nav" data-view="auctions"><span class="nav-icon">▦</span> Watchlist <span class="nav-count" id="nav-auctions">0</span></button>
        <button class="nav" data-view="alerts"><span class="nav-icon">⚑</span> Signals <span class="nav-count" id="nav-alerts">0</span></button>
        <button class="nav" data-view="guide"><span class="nav-icon">◇</span> Methodology</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="side-panel"><span class="dot mint"></span><span>FREE TIER READY</span><small>Workers · D1 · Static assets</small></div>
        <p>Evidence-led screening. A pattern is not proof of wrongdoing.</p>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumbs"><span class="mobile-brand">◈ SHILLBID</span><span class="desktop-breadcrumb">WORKSPACE <span class="breadcrumb-chevron">/</span></span><strong id="breadcrumb">Overview</strong></div>
        <div class="top-actions"><div class="connection"><span class="dot" id="connection-dot"></span><span id="connection-text">Preview mode</span></div><button class="button subtle" id="auth-button">Connect workspace</button><button class="button primary" id="new-watch">＋ <span>Track auction</span></button></div>
      </header>
      <main class="content" id="content" aria-live="polite"></main>
      <footer class="footer"><span>SHILLBID / INVESTIGATIONS</span><span>Built on Cloudflare · No paid services required</span></footer>
    </div>
  </div>
  <div id="modal" class="modal-layer hidden" role="presentation"></div>
  <div class="toast hidden" id="toast" role="status"></div>
</body>
</html>
